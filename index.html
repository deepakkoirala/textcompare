<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text Compare</title>

  <!-- Tailwind CSS v4 (browser build) -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- App logic must register before Alpine starts (deferred scripts run in order) -->
  <script defer src="app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <style>[x-cloak] { display: none !important; }</style>
</head>

<body class="min-h-screen bg-gray-100 text-gray-900 dark:bg-gray-950 dark:text-gray-100">
  <div x-data="textCompare" x-cloak class="mx-auto max-w-[112rem] px-4 py-8"
       @keydown.window.ctrl.enter="compare()" @keydown.window.meta.enter="compare()">

    <!-- Header -->
    <header class="mb-6 flex flex-wrap items-end justify-between gap-4">
      <div>
        <h1 class="text-3xl font-bold tracking-tight">Text Compare</h1>
        <p class="text-sm text-gray-500 dark:text-gray-400">Paste text on each side and hit compare. Line and word level differences are highlighted.</p>
      </div>
      <div class="flex flex-wrap gap-2">
        <button @click="loadSample()" class="rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm font-medium hover:bg-gray-50 dark:border-gray-700 dark:bg-gray-900 dark:hover:bg-gray-800">Load sample</button>
        <button @click="clearAll()" class="rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm font-medium hover:bg-gray-50 dark:border-gray-700 dark:bg-gray-900 dark:hover:bg-gray-800">Clear all</button>
        <button x-show="!hasThird" @click="addThird()" class="rounded-lg border border-indigo-300 bg-indigo-50 px-3 py-2 text-sm font-medium text-indigo-700 hover:bg-indigo-100 dark:border-indigo-800 dark:bg-indigo-950 dark:text-indigo-300">+ Add third text</button>
        <button x-show="hasThird" @click="removeThird()" class="rounded-lg border border-red-300 bg-red-50 px-3 py-2 text-sm font-medium text-red-700 hover:bg-red-100 dark:border-red-800 dark:bg-red-950 dark:text-red-300">− Remove third text</button>
      </div>
    </header>

    <!-- Text inputs -->
    <section class="grid gap-4" :class="hasThird ? 'lg:grid-cols-3' : 'md:grid-cols-2'">
      <template x-for="(text, i) in texts" :key="i">
        <div class="flex flex-col overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm dark:border-gray-800 dark:bg-gray-900">
          <div class="flex items-center gap-2 border-b border-gray-200 px-3 py-2 dark:border-gray-800">
            <span class="flex size-6 items-center justify-center rounded-full bg-indigo-600 text-xs font-bold text-white" x-text="String.fromCharCode(65 + i)"></span>
            <input x-model="text.label" class="min-w-0 flex-1 bg-transparent text-sm font-semibold outline-none" placeholder="Label" />
            <button @click="pasteFromClipboard(i)" class="rounded px-2 py-1 text-xs text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800" title="Paste from clipboard">Paste</button>
            <label class="cursor-pointer rounded px-2 py-1 text-xs text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800" title="Load from file">
              Open
              <input type="file" class="hidden" accept=".txt,.md,.json,.csv,.js,.ts,.html,.css,.xml,.yml,.yaml,.log,text/*" @change="loadFile($event, i)" />
            </label>
            <button @click="text.value = ''" class="rounded px-2 py-1 text-xs text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800">Clear</button>
          </div>
          <textarea x-model="text.value" spellcheck="false" rows="14"
                    class="w-full flex-1 resize-y bg-transparent p-3 font-mono text-sm outline-none placeholder:text-gray-400"
                    :placeholder="'Paste ' + (i === 0 ? 'original' : i === 1 ? 'changed' : 'third') + ' text here…'"></textarea>
          <div class="border-t border-gray-200 px-3 py-1.5 text-xs text-gray-500 dark:border-gray-800 dark:text-gray-400">
            <span x-text="lineCount(text.value)"></span> lines · <span x-text="text.value.length"></span> chars
          </div>
        </div>
      </template>
    </section>

    <!-- Controls -->
    <section class="mt-4 flex flex-wrap items-center justify-between gap-4 rounded-xl border border-gray-200 bg-white px-4 py-3 shadow-sm dark:border-gray-800 dark:bg-gray-900">
      <div class="flex flex-wrap items-center gap-x-5 gap-y-2 text-sm">
        <label class="flex items-center gap-2"><input type="checkbox" x-model="options.ignoreWhitespace" class="accent-indigo-600" /> Ignore whitespace</label>
        <label class="flex items-center gap-2"><input type="checkbox" x-model="options.ignoreCase" class="accent-indigo-600" /> Ignore case</label>
        <label class="flex items-center gap-2"><input type="checkbox" x-model="hideUnchanged" class="accent-indigo-600" /> Only show changes</label>
        <button @click="swap(0, 1)" class="rounded-lg px-2 py-1 text-indigo-600 hover:bg-indigo-50 dark:text-indigo-400 dark:hover:bg-indigo-950">⇄ Swap A / B</button>
      </div>
      <div class="flex items-center gap-3">
        <span class="hidden text-xs text-gray-400 sm:inline">Ctrl / ⌘ + Enter</span>
        <button @click="compare()" class="rounded-lg bg-indigo-600 px-6 py-2.5 text-sm font-semibold text-white shadow hover:bg-indigo-500 active:bg-indigo-700">Compare</button>
      </div>
    </section>

    <!-- Error -->
    <div x-show="error" class="mt-4 rounded-lg border border-red-300 bg-red-50 px-4 py-3 text-sm text-red-700 dark:border-red-800 dark:bg-red-950 dark:text-red-300" x-text="error"></div>

    <!-- Results -->
    <section x-ref="results" x-show="current" class="mt-8 scroll-mt-4">
      <!-- Pair tabs (only with three texts) -->
      <div x-show="results.length > 1" class="mb-4 flex flex-wrap gap-2">
        <template x-for="(r, idx) in results" :key="idx">
          <button @click="activePair = idx"
                  class="flex items-center gap-2 rounded-lg border px-3 py-2 text-sm font-medium"
                  :class="activePair === idx
                    ? 'border-indigo-600 bg-indigo-600 text-white'
                    : 'border-gray-300 bg-white hover:bg-gray-50 dark:border-gray-700 dark:bg-gray-900 dark:hover:bg-gray-800'">
            <span x-text="pairLabel(r)"></span>
            <span class="rounded-full px-1.5 text-xs"
                  :class="activePair === idx ? 'bg-white/20' : (r.stats.identical ? 'bg-green-100 text-green-700 dark:bg-green-900 dark:text-green-300' : 'bg-amber-100 text-amber-700 dark:bg-amber-900 dark:text-amber-300')"
                  x-text="r.stats.identical ? 'same' : r.stats.similarity + '%'"></span>
          </button>
        </template>
      </div>

      <template x-if="current">
        <div class="overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm dark:border-gray-800 dark:bg-gray-900">
          <!-- Summary bar -->
          <div class="flex flex-wrap items-center justify-between gap-3 border-b border-gray-200 px-4 py-3 dark:border-gray-800">
            <div class="flex flex-wrap items-center gap-2 text-sm">
              <span class="font-semibold" x-text="pairLabel(current)"></span>
              <span class="rounded-full bg-green-100 px-2 py-0.5 text-xs font-medium text-green-700 dark:bg-green-900/60 dark:text-green-300">+<span x-text="current.stats.added"></span> added</span>
              <span class="rounded-full bg-red-100 px-2 py-0.5 text-xs font-medium text-red-700 dark:bg-red-900/60 dark:text-red-300">−<span x-text="current.stats.removed"></span> removed</span>
              <span class="rounded-full bg-amber-100 px-2 py-0.5 text-xs font-medium text-amber-700 dark:bg-amber-900/60 dark:text-amber-300">~<span x-text="current.stats.modified"></span> modified</span>
              <span class="rounded-full bg-gray-100 px-2 py-0.5 text-xs font-medium text-gray-600 dark:bg-gray-800 dark:text-gray-300"><span x-text="current.stats.unchanged"></span> unchanged</span>
            </div>
            <div class="flex items-center gap-3">
              <div class="flex items-center gap-2 text-xs text-gray-500 dark:text-gray-400">
                <div class="h-2 w-24 overflow-hidden rounded-full bg-gray-200 dark:bg-gray-700">
                  <div class="h-full rounded-full bg-indigo-500" :style="`width: ${current.stats.similarity}%`"></div>
                </div>
                <span x-text="current.stats.similarity + '% similar'"></span>
              </div>
              <div class="flex rounded-lg border border-gray-300 p-0.5 text-xs dark:border-gray-700">
                <button @click="view = 'split'" class="rounded-md px-3 py-1" :class="view === 'split' ? 'bg-indigo-600 text-white' : 'hover:bg-gray-100 dark:hover:bg-gray-800'">Side by side</button>
                <button @click="view = 'unified'" class="rounded-md px-3 py-1" :class="view === 'unified' ? 'bg-indigo-600 text-white' : 'hover:bg-gray-100 dark:hover:bg-gray-800'">Unified</button>
              </div>
            </div>
          </div>

          <!-- Identical -->
          <div x-show="current.stats.identical" class="flex items-center gap-2 bg-green-50 px-4 py-3 text-sm font-medium text-green-700 dark:bg-green-950/50 dark:text-green-300">
            ✓ The texts are identical<span x-show="options.ignoreWhitespace || options.ignoreCase"> (with current ignore options)</span>.
          </div>

          <div class="max-h-[70vh] overflow-auto">
            <!-- Side by side -->
            <table x-show="view === 'split'" class="w-full table-fixed border-collapse font-mono text-sm">
              <colgroup><col class="w-12" /><col /><col class="w-12" /><col /></colgroup>
              <thead class="sticky top-0 z-10 bg-gray-50 text-xs font-sans text-gray-500 dark:bg-gray-800 dark:text-gray-400">
                <tr>
                  <th colspan="2" class="border-b border-r border-gray-200 px-3 py-2 text-left font-semibold dark:border-gray-700" x-text="texts[current.a].label"></th>
                  <th colspan="2" class="border-b border-gray-200 px-3 py-2 text-left font-semibold dark:border-gray-700" x-text="texts[current.b].label"></th>
                </tr>
              </thead>
              <tbody>
                <template x-for="(row, idx) in rows" :key="idx">
                  <tr>
                    <template x-if="row.type === 'collapsed'">
                      <td colspan="4" class="bg-indigo-50/60 px-3 py-1 text-center font-sans text-xs text-indigo-600 dark:bg-indigo-950/40 dark:text-indigo-300"
                          x-text="`⋯ ${row.count} unchanged line${row.count > 1 ? 's' : ''} hidden ⋯`"></td>
                    </template>
                    <template x-if="row.type !== 'collapsed'">
                      <td class="select-none border-r border-gray-100 px-2 text-right align-top text-xs leading-6 text-gray-400 dark:border-gray-800" :class="rowClass(row.type, 'left')" x-text="row.leftNo ?? ''"></td>
                    </template>
                    <template x-if="row.type !== 'collapsed'">
                      <td class="whitespace-pre-wrap break-all border-r border-gray-200 px-3 align-top leading-6 dark:border-gray-700" :class="rowClass(row.type, 'left')" x-html="row.leftHtml || '&#8203;'"></td>
                    </template>
                    <template x-if="row.type !== 'collapsed'">
                      <td class="select-none border-r border-gray-100 px-2 text-right align-top text-xs leading-6 text-gray-400 dark:border-gray-800" :class="rowClass(row.type, 'right')" x-text="row.rightNo ?? ''"></td>
                    </template>
                    <template x-if="row.type !== 'collapsed'">
                      <td class="whitespace-pre-wrap break-all px-3 align-top leading-6" :class="rowClass(row.type, 'right')" x-html="row.rightHtml || '&#8203;'"></td>
                    </template>
                  </tr>
                </template>
              </tbody>
            </table>

            <!-- Unified -->
            <table x-show="view === 'unified'" class="w-full table-fixed border-collapse font-mono text-sm">
              <colgroup><col class="w-12" /><col class="w-12" /><col class="w-6" /><col /></colgroup>
              <tbody>
                <template x-for="(row, idx) in rows" :key="idx">
                  <tr :class="{
                        'bg-red-50 dark:bg-red-950/40': row.type === 'delete',
                        'bg-green-50 dark:bg-green-950/40': row.type === 'insert',
                        'bg-indigo-50/60 dark:bg-indigo-950/40': row.type === 'collapsed' }">
                    <template x-if="row.type === 'collapsed'">
                      <td colspan="4" class="px-3 py-1 text-center font-sans text-xs text-indigo-600 dark:text-indigo-300"
                          x-text="`⋯ ${row.count} unchanged line${row.count > 1 ? 's' : ''} hidden ⋯`"></td>
                    </template>
                    <template x-if="row.type !== 'collapsed'">
                      <td class="select-none px-2 text-right align-top text-xs leading-6 text-gray-400" x-text="row.leftNo ?? ''"></td>
                    </template>
                    <template x-if="row.type !== 'collapsed'">
                      <td class="select-none border-r border-gray-200 px-2 text-right align-top text-xs leading-6 text-gray-400 dark:border-gray-700" x-text="row.rightNo ?? ''"></td>
                    </template>
                    <template x-if="row.type !== 'collapsed'">
                      <td class="select-none text-center align-top leading-6 font-bold"
                          :class="row.type === 'delete' ? 'text-red-600' : row.type === 'insert' ? 'text-green-600' : 'text-gray-300'"
                          x-text="row.type === 'delete' ? '−' : row.type === 'insert' ? '+' : ''"></td>
                    </template>
                    <template x-if="row.type !== 'collapsed'">
                      <td class="whitespace-pre-wrap break-all px-3 align-top leading-6" x-html="row.html || '&#8203;'"></td>
                    </template>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>

          <!-- Legend -->
          <div class="flex flex-wrap gap-4 border-t border-gray-200 px-4 py-2 text-xs text-gray-500 dark:border-gray-800 dark:text-gray-400">
            <span class="flex items-center gap-1.5"><span class="size-3 rounded-sm bg-red-200 dark:bg-red-800"></span> Removed</span>
            <span class="flex items-center gap-1.5"><span class="size-3 rounded-sm bg-green-200 dark:bg-green-800"></span> Added</span>
            <span class="flex items-center gap-1.5"><mark class="rounded-sm bg-red-300/70 px-1 line-through dark:bg-red-700/70">word</mark> / <mark class="rounded-sm bg-green-300/70 px-1 dark:bg-green-700/70">word</mark> Changed words in a modified line</span>
          </div>
        </div>
      </template>
    </section>

  </div>
</body>
</html>
